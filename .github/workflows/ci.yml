name: Cocotb Dual-Sim CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install simulators and Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator python3-pip
          python3 -m pip install --break-system-packages cocotb==1.9.2 pytest pillow

      - name: Run Icarus Verilog simulation
        run: make -C tb SIM=icarus

      - name: Run Verilator simulation with RTL coverage
        run: |
          make -C tb clean
          make -C tb SIM=verilator VERILATOR_COVERAGE=1
          verilator_coverage --annotate coverage_report tb/coverage.dat
          verilator_coverage --rank tb/coverage.dat

      - name: Upload rendered shader frame and coverage report
        uses: actions/upload-artifact@v4
        with:
          name: sim-artifacts
          path: |
            tb/nk_gpu_render.png
            coverage_report/
